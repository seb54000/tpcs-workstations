---
- name: Require the observed Demoboard OS
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version == '24.04'
      - ansible_architecture == 'x86_64'

- name: Load supported runtime branches
  ansible.builtin.set_fact:
    demoboard_apt_constraints: "{{ lookup('file', playbook_dir ~ '/versions/apt-constraints.json') | from_json }}"

- name: Read installed package versions before applying compatibility policy
  ansible.builtin.package_facts:
    manager: apt

- name: Refuse installed runtimes outside the supported branches
  ansible.builtin.assert:
    that:
      - >-
        (ansible_facts.packages[item.key] | map(attribute='version') |
        select('match', '^' ~ (item.value | regex_escape | replace('\*', '.*')) ~ '$') | list | length)
        == (ansible_facts.packages[item.key] | length)
    fail_msg: "{{ item.key }} is installed outside {{ item.value }}; review the runtime migration explicitly."
    quiet: true
  loop: "{{ demoboard_apt_constraints | dict2items }}"
  when: item.key in ansible_facts.packages

- name: Constrain runtime branches while allowing distribution fixes
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/00-tpcs-demoboard-baseline
    mode: '0644'
    content: |
      # Runtime branches only; system dependencies follow Ubuntu LTS updates.
      {% for package, version in demoboard_apt_constraints.items() %}
      Package: {{ package }}
      Pin: version {{ version }}
      Pin-Priority: 990

      Package: {{ package }}
      Pin: version *
      Pin-Priority: -1

      {% endfor %}
