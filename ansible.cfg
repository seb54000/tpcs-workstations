[defaults]
filter_plugins = versions/filter_plugins
inventory = inventory_aws_ec2.yml
private_key_file = terraform-infra/key
host_key_checking = False
retry_files_enabled = False
forks = 15
interpreter_python = /usr/bin/python3
# Persist task timings and total duration in the prepare script's captured output.
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer
# Number of nodes taht Ansible control node will connect simultaneously
# https://medium.com/devops-srilanka/difference-between-forks-and-serial-in-ansible-48677ebe3f36

[inventory]
enable_plugins = aws_ec2

[callback_profile_tasks]
# Show timings throughout the run and the 30 slowest tasks in the final recap.
summary_only = false
task_output_limit = 30
sort_order = descending
