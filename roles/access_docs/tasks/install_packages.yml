---

- name: Install apt packages
  ansible.builtin.apt:
    name: "{{ (access_docs_apt_packages | tpcs_pinned_packages(tpcs_apt_versions)) if (tpcs_baseline_enabled | default(false) | bool) else access_docs_apt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install snap packages
  community.general.snap:
    name: "{{ item.package }}"
    state: present
    classic: "{{ item.classic }}"
  loop: "{{ access_docs_snap_packages }}"
  when: not (tpcs_baseline_enabled | default(false) | bool)

- name: Install captured snap revisions
  ansible.builtin.include_tasks: "{{ playbook_dir }}/versions/tasks/pinned_snap.yml"
  loop: "{{ access_docs_snap_packages }}"
  when: tpcs_baseline_enabled | default(false) | bool
