---

# tasks file for vms student
- name: Prepare enabled TP variables
  ansible.builtin.import_tasks: aggregate.yml
  tags:
    - student_snaps
    - student_vscode

- name: Authorize password authentication SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PasswordAuthentication\s+no'
    line: 'PasswordAuthentication yes'
    state: present
    backrefs: yes
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh

- name: Apply SSH configuration before continuing provisioning
  ansible.builtin.meta: flush_handlers

- name: Check if student swap file exists
  ansible.builtin.stat:
    path: "{{ student_swap_file_path }}"
  register: student_swap_file

- name: Create student swap file
  ansible.builtin.command: "fallocate -l {{ student_swap_size_mb }}M {{ student_swap_file_path }}"
  when: not student_swap_file.stat.exists

- name: Set student swap file permissions
  ansible.builtin.file:
    path: "{{ student_swap_file_path }}"
    owner: root
    group: root
    mode: '0600'

- name: Format student swap file
  ansible.builtin.command: "mkswap {{ student_swap_file_path }}"
  when: not student_swap_file.stat.exists

- name: Check active student swap files
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: student_active_swap
  changed_when: false

- name: Enable student swap now
  ansible.builtin.command: "swapon {{ student_swap_file_path }}"
  when: student_swap_file_path not in student_active_swap.stdout_lines

- name: Persist student swap file
  ansible.builtin.mount:
    name: none
    src: "{{ student_swap_file_path }}"
    fstype: swap
    opts: sw
    passno: '0'
    dump: '0'
    state: present

- name: Persist student swap tuning
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-tpcs-student-swap.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      vm.swappiness = {{ student_swappiness }}

- name: Apply student swap tuning now
  ansible.builtin.command: "sysctl -w vm.swappiness={{ student_swappiness }}"
  changed_when: false

- name: Install vm student apt packages
  ansible.builtin.apt:
    name: "{{ (item | tpcs_pinned_packages(tpcs_apt_versions)) if (tpcs_baseline_enabled | default(false) | bool) else item }}"
    state: present
    update_cache: true
  loop: "{{ student_common_apt_packages }}"

- name: Install missing student snaps
  ansible.builtin.import_tasks: snaps.yml
  tags: student_snaps

- name: Add group ssl-cert to xrdp user
  ansible.builtin.user:
    name: xrdp
    groups: ssl-cert
    append: yes
  when: acme_certificates_enable | bool

- name: Add group docker to vm user
  ansible.builtin.user:
    name: vm{{ student_count_number_2digits }}
    groups: docker
    append: yes

- name: Create parent directory for student static and template files
  ansible.builtin.file:
    path: "{{ item.dest_path | dirname }}"
    state: directory
    owner: "{{ ansible_hostname }}"
    mode: '0755'
  loop: "{{ student_enabled_template_files + student_common_custom_files + student_common_template_files }}"

- name: Copy static custom files
  become_user: "{{ item.owner }}"
  ansible.builtin.copy:
    src: "{{ item.src_path }}"
    dest: "{{ item.dest_path }}"
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: '0644'
  loop: "{{ student_common_custom_files }}"

- name: Template and Copy student template files (either for tpiac, tpkube or tpmon)
  ansible.builtin.template:
    src: "{{ item.src_path }}"
    dest: "{{ item.dest_path }}"
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode | default('0644') }}"
  loop: "{{ student_enabled_template_files + student_common_template_files }}"

- name: Generate self signed SSL certificate for XRDP # Tried to use community.crypto.x509_certificate ansible module but not easy to setup subject (need to create a csr file ?)
  ansible.builtin.command: >-
    openssl req -x509 -sha384
    -newkey rsa:3072 -nodes
    -keyout /etc/xrdp/key.pem
    -out /etc/xrdp/cert.pem
    -days 365
    -subj "/C=US/ST=Denial/L=Springfield/O=Dis/CN=www.example.com"
  args:
    creates: /etc/xrdp/key.pem

- name: Manage xfce browser shortcut to use chromium
  ansible.builtin.lineinfile:
    path: /usr/share/applications/xfce4-web-browser.desktop
    regexp: 'Exec.*'
    line: 'Exec=chromium'
    backrefs: yes
    state: present

- name: Remove legacy automatic tpiac environment sourcing block from .bashrc
  ansible.builtin.blockinfile:
    path: "/home/{{ ansible_hostname }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - TPIAC environment"
    state: absent
    owner: "{{ ansible_hostname }}"
    group: "{{ ansible_hostname }}"

- name: Remove legacy automatic tpiac environment sourcing line from .bashrc
  ansible.builtin.lineinfile:
    path: "/home/{{ ansible_hostname }}/.bashrc"
    regexp: '^source /home/{{ ansible_hostname }}/tpcs-iac/.env$'
    state: absent
    owner: "{{ ansible_hostname }}"
    group: "{{ ansible_hostname }}"

- name: Install missing student VS Code extensions
  ansible.builtin.import_tasks: vscode.yml
  tags: student_vscode

- name: Git clone repository for enabled TPs
  ansible.builtin.include_tasks:
    file: "git_clone.yml"

- name: Run specific tasks needed for enabled TPs
  ansible.builtin.include_tasks:
    file: "{{ student_current_tp_name }}.yml"
  loop: "{{ student_enabled_tp_names }}"
  loop_control:
    loop_var: student_current_tp_name

- name: Configure EKS/ECR access files and aliases
  ansible.builtin.include_tasks:
    file: eks.yml
