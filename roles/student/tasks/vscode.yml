---
- name: List installed VS Code extensions
  become_user: "{{ ansible_hostname }}"
  ansible.builtin.command: code --list-extensions
  register: student_vscode_installed
  changed_when: false
  check_mode: false
  until: student_vscode_installed is succeeded
  retries: "{{ student_software_retries | default(5) }}"
  delay: "{{ student_software_retry_delay | default(20) }}"
  when: student_enabled_vscode_extensions | length > 0

- name: Install vscode extensions
  become_user: "{{ ansible_hostname }}"
  ansible.builtin.command:
    argv:
      - code
      - --install-extension
      - "{{ item }}"
  loop: "{{ student_enabled_vscode_extensions }}"
  when: (item | lower) not in (student_vscode_installed.stdout_lines | default([]) | map('lower') | list)
  register: student_vscode_install
  changed_when:
    - student_vscode_install.rc == 0
    - "'is already installed' not in student_vscode_install.stdout"
  until: student_vscode_install is succeeded
  retries: "{{ student_software_retries | default(5) }}"
  delay: "{{ student_software_retry_delay | default(20) }}"
  throttle: 3
