
- name: Install Python packaging prerequisites for tpmon
  ansible.builtin.apt:
    name:
      - python3-setuptools
      - python3-wheel
      - python3-thrift
    state: present
    update_cache: true

- name: Install multi python packages for tpmon
  ansible.builtin.pip:
    break_system_packages: true
    name:
      - flask<3
      # Keep OpenTelemetry packages on the last release family that still ships the Jaeger exporter.
      - opentelemetry-api==1.21.0
      - opentelemetry-sdk==1.21.0
      - opentelemetry-instrumentation==0.42b0
      - opentelemetry-instrumentation-flask==0.42b0
      - opentelemetry-exporter-prometheus==0.42b0
      - opentelemetry-exporter-jaeger==1.21.0
      - opentelemetry-instrumentation-requests==0.42b0
      - prometheus_client<1
      - thrift<0.17

# TODO : when condition to do it only first time (or to be able to force it dependaing on a var ??)
- name: Stop node exporter for first part of the work
  become: true
  ansible.builtin.systemd_service:
    state: stopped
    name: "node_exporter.service"

- name: Preseed wireshark setuid debconf answer
  ansible.builtin.debconf:
    name: wireshark-common
    question: wireshark-common/install-setuid
    vtype: boolean
    value: "true"

- name: Install wireshark
  ansible.builtin.apt:
    name: wireshark
    state: present
    update_cache: true

- name: Install Java runtime for JMeter
  ansible.builtin.apt:
    name: openjdk-8-jdk
    state: present
    update_cache: true
  when: student_install_jmeter | bool

- name: Download Apache JMeter archive
  ansible.builtin.get_url:
    url: https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.5.tgz
    dest: /tmp/apache-jmeter-5.5.tgz
    mode: "0644"
    force: false
  when: student_install_jmeter | bool

- name: Install Apache JMeter
  ansible.builtin.unarchive:
    src: /tmp/apache-jmeter-5.5.tgz
    dest: /usr/local/bin
    remote_src: true
    owner: root
    group: root
    creates: /usr/local/bin/apache-jmeter-5.5/bin/jmeter
  when: student_install_jmeter | bool

- name: Ensure JMeter PATH is available for student user
  ansible.builtin.lineinfile:
    path: "/home/{{ ansible_hostname }}/.bashrc"
    line: 'export PATH="/usr/local/bin/apache-jmeter-5.5/bin:$PATH"'
    create: true
    owner: "{{ ansible_hostname }}"
    group: "{{ ansible_hostname }}"
    mode: "0644"
  when: student_install_jmeter | bool
