---
- name: Validate SSH configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  listen: Reload ssh

- name: Reload SSH configuration
  ansible.builtin.systemd:
    name: ssh
    state: reloaded
  listen: Reload ssh

- name: Restart node exporter for TP IaC textfile metrics
  ansible.builtin.systemd:
    name: node_exporter
    daemon_reload: true
    state: restarted
  listen: Restart node exporter
