- name: Install common snap packages
  community.general.snap:
    name: "{{ item.package }}"
    state: present
    classic: "{{ item.classic }}"
  loop: "{{ common_snap_packages }}"
  when: not (tpcs_baseline_enabled | default(false) | bool)

- name: Install captured common snap revisions
  ansible.builtin.include_tasks: "{{ tpcs_repo_root | default(playbook_dir) }}/versions/tasks/pinned_snap.yml"
  loop: "{{ common_snap_packages }}"
  when: tpcs_baseline_enabled | default(false) | bool
